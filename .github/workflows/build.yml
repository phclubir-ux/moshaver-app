name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: نصب جاوا و ابزارها
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk wget unzip
          
      - name: دانلود Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          echo "sdk.dir=$HOME/android-sdk" > $HOME/local.properties

      - name: قبول لایسنس‌ها و نصب اجزا
        run: |
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: ساخت پروژهٔ اپ (آدرس سایت هاردکد)
        run: |
          mkdir -p app/src/main/java/ir/physicstory/moshaver
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml
          
          # ---------- فایل‌های پروژه ----------
          cat > settings.gradle <<'EOF'
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositories { google(); mavenCentral() } }
rootProject.name = "Moshaver"
include ':app'
EOF

          cat > build.gradle <<'EOF'
plugins { id 'com.android.application' version '8.1.4' apply false }
EOF

          cat > app/build.gradle <<'EOF'
plugins { id 'com.android.application' }
android {
    namespace 'ir.physicstory.moshaver'
    compileSdk 34
    defaultConfig {
        applicationId "ir.physicstory.moshaver"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword 'MoshaApp1405'
            keyAlias 'moshaver'
            keyPassword 'MoshaApp1405'
        }
    }
    buildTypes.release.signingConfig = signingConfigs.release
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET"/>
    <application android:label="مهندس احمدپور" android:icon="@mipmap/ic_launcher" android:theme="@style/AppTheme" android:usesCleartextTraffic="false">
        <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden" android:launchMode="singleTask">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
            <intent-filter android:autoVerify="true">
                <action android:name="android.intent.action.VIEW"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <category android:name="android.intent.category.BROWSABLE"/>
                <data android:scheme="https" android:host="physicstory.ir" android:pathPrefix="/moshaver"/>
            </intent-filter>
        </activity>
        <meta-data android:name="asset_statements" android:resource="@string/asset_statements"/>
    </application>
</manifest>
EOF

          # ---------- آدرس شروع: مستقیم و هاردکد ----------
          cat > app/src/main/res/values/strings.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">مهندس احمدپور</string>
    <string name="twa_url">https://physicstory.ir/moshaver/index.php</string>
    <string name="asset_statements">[{
  \"relation\": [\"delegate_permission/common.handle_all_urls\"],
  \"target\": { \"namespace\": \"web\", \"site\": \"https://physicstory.ir\" }
}]</string>
</resources>
EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
<resources>
    <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
        <item name="android:statusBarColor">#141519</item>
        <item name="android:navigationBarColor">#141519</item>
        <item name="android:windowBackground">#141519</item>
    </style>
</resources>
EOF

          cat > app/src/main/res/drawable/splash.xml <<'EOF'
<layer-list xmlns:android="http://schemas.android.com/apk/res/android">
    <item android:drawable="#141519"/>
</layer-list>
EOF

          # ---------- MainActivity: WebView قوی به‌جای TWA (بدون نیاز به assetlinks) ----------
          cat > app/src/main/java/ir/physicstory/moshaver/MainActivity.java <<'EOF'
package ir.physicstory.moshaver;

import android.annotation.SuppressLint;
import android.app.Activity;
import android.graphics.Color;
import android.os.Bundle;
import android.view.View;
import android.webkit.WebChromeClient;
import android.webkit.WebResourceRequest;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.content.Intent;
import android.net.Uri;

public class MainActivity extends Activity {
    private WebView web;
    private static final String URL = "https://physicstory.ir/moshaver/index.php";

    @SuppressLint("SetJavaScriptEnabled")
    @Override
    protected void onCreate(Bundle b) {
        super.onCreate(b);
        web = new WebView(this);
        WebSettings s = web.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);
        s.setDatabaseEnabled(true);
        s.setAllowFileAccess(false);
        s.setMediaPlaybackRequiresUserGesture(false);
        s.setJavaScriptCanOpenWindowsAutomatically(true);
        s.setSupportZoom(false);
        s.setLoadWithOverviewMode(true);
        s.setUseWideViewPort(true);
        web.setWebChromeClient(new WebChromeClient());
        web.setWebViewClient(new WebViewClient() {
            @Override
            public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                Uri u = r.getUrl();
                String host = u.getHost() == null ? "" : u.getHost();
                // لینک‌های خارجی (تلگرام، واتساپ، درگاه پرداخت...) در مرورگر/اپ مقصد باز شوند
                if (!host.contains("physicstory.ir")) {
                    try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) {}
                    return true;
                }
                return false;
            }
        });
        web.setBackgroundColor(Color.parseColor("#141519"));
        setContentView(web);
        web.loadUrl(URL);
    }

    @Override
    public void onBackPressed() {
        if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed();
    }
}
EOF

          # ---------- آیکون‌ها ----------
          wget -q -O icon.png "https://physicstory.ir/wp-content/uploads/2026/09/1231.png"
          # آیکون 512 برای adaptive icon
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/iconbg"/>
    <foreground android:drawable="@mipmap/iconfg"/>
</adaptive-icon>
EOF
          cat > app/src/main/res/values/colors.xml <<'EOF'
<resources><color name="iconbg">#FFFFFF</color></resources>
EOF
          # resize با imagemagick
          sudo apt-get install -y imagemagick -qq
          for S in 108 162 216 324 432; do
            convert icon.png -resize ${S}x${S} -background white -gravity center -extent ${S}x${S} fg_${S}.png
          done
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          cp fg_108.png app/src/main/res/mipmap-mdpi/iconfg.png
          cp fg_162.png app/src/main/res/mipmap-hdpi/iconfg.png
          cp fg_216.png app/src/main/res/mipmap-xhdpi/iconfg.png
          cp fg_324.png app/src/main/res/mipmap-xxhdpi/iconfg.png
          cp fg_432.png app/src/main/res/mipmap-xxxhdpi/iconfg.png
          cp fg_192.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || convert icon.png -resize 192x192 -background white -gravity center -extent 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert icon.png -resize 108x108 -background white -gravity center -extent 108x108 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.png -resize 162x162 -background white -gravity center -extent 162x162 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 216x216 -background white -gravity center -extent 216x216 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.png -resize 324x324 -background white -gravity center -extent 324x324 app/src/main/res/mipmap-xxhdpi/ic_launcher.png

      - name: ساخت کلید امضا
        run: |
          keytool -genkeypair -v -keystore app/keystore.jks -alias moshaver \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass MoshaApp1405 -keypass MoshaApp1405 \
            -dname "CN=Moshaver, OU=App, O=Ahmadpour, L=Mashhad, C=IR"

      - name: کامپایل APK
        run: |
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          chmod +x ./gradlew || true
          # gradle wrapper
          gradle_version=8.4
          wget -q https://services.gradle.org/distributions/gradle-${gradle_version}-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -s /opt/gradle-${gradle_version}/bin/gradle /usr/local/bin/gradle
          gradle assembleRelease --no-daemon -q

      - name: تحویل APK
        uses: actions/upload-artifact@v4
        with:
          name: moshaver-apk
          path: app/build/outputs/apk/release/app-release.apk
