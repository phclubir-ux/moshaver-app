name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس سایت بدون https'
        required: true
        default: 'ADRES-SITE.ir/moshaver'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: MoshaApp1405
      BUBBLEWRAP_KEY_PASSWORD: MoshaApp1405
      BUBBLEWRAP_KEY_ALIAS: android
    steps:
      - name: نصب ابزار
        run: npm install -g @bubblewrap/cli

      - name: ساخت پروژه
        run: |
          printf 'n\nandroid.keystore\nandroid\nMoshaApp1405\nMoshaApp1405\n' | bubblewrap init --manifest="https://${{ github.event.inputs.site_url }}/index.php?manifest" --directory=app

      - name: بستن APK
        working-directory: app
        run: bubblewrap build --skipPwaValidation

      - name: تحویل فایل
        uses: actions/upload-artifact@v4
        with:
          name: moshaver-apk
          path: app/app-release-signed.apk
