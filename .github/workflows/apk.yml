name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk wget unzip imagemagick
      - name: sdk
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: project
        run: |
          mkdir -p app/src/main/java/ir/physicstory/moshaver
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          printf '%s\n' "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" "dependencyResolutionManagement { repositories { google(); mavenCentral() } }" "rootProject.name = 'Moshaver'" "include ':app'" > settings.gradle
          printf '%s\n' "plugins { id 'com.android.application' version '8.1.4' apply false }" > build.gradle
          printf '%s\n' "plugins { id 'com.android.application' }" "android {" "    namespace 'ir.physicstory.moshaver'" "    compileSdk 34" "    defaultConfig {" "        applicationId 'ir.physicstory.moshaver'" "        minSdk 23" "        targetSdk 34" "        versionCode 1" "        versionName '1.0'" "    }" "    signingConfigs {" "        release {" "            storeFile file('keystore.jks')" "            storePassword 'MoshaApp1405'" "            keyAlias 'moshaver'" "            keyPassword 'MoshaApp1405'" "        }" "    }" "    buildTypes {" "        release {" "            minifyEnabled false" "            signingConfig signingConfigs.release" "        }" "    }" "}" "dependencies {" "    implementation 'androidx.appcompat:appcompat:1.6.1'" "}" > app/build.gradle
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' '    <uses-permission android:name="android.permission.INTERNET"/>' '    <application' '        android:label="مهندس احمدپور"' '        android:icon="@mipmap/ic_launcher"' '        android:usesCleartextTraffic="false"' '        android:supportsRtl="true">' '        <activity' '            android:name=".MainActivity"' '            android:exported="true"' '            android:configChanges="orientation|screenSize|keyboardHidden"' '            android:launchMode="singleTask"' '            android:theme="@style/AppTheme">' '            <intent-filter>' '                <action android:name="android.intent.action.MAIN"/>' '                <category android:name="android.intent.category.LAUNCHER"/>' '            </intent-filter>' '        </activity>' '    </application>' '</manifest>' > app/src/main/AndroidManifest.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <string name="app_name">مهندس احمدپور</string>' '</resources>' > app/src/main/res/values/strings.xml
          printf '%s\n' '<resources>' '    <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">' '        <item name="android:statusBarColor">#141519</item>' '        <item name="android:navigationBarColor">#141519</item>' '        <item name="android:windowBackground">#141519</item>' '    </style>' '</resources>' > app/src/main/res/values/styles.xml
          printf '%s\n' '<resources>' '    <color name="iconbg">#FFFFFF</color>' '</resources>' > app/src/main/res/values/colors.xml
          printf '%s\n' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '    <background android:drawable="@color/iconbg"/>' '    <foreground android:drawable="@mipmap/iconfg"/>' '</adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          printf '%s\n' 'package ir.physicstory.moshaver;' '' 'import android.annotation.SuppressLint;' 'import android.app.Activity;' 'import android.graphics.Color;' 'import android.os.Bundle;' 'import android.content.Intent;' 'import android.net.Uri;' 'import android.webkit.WebChromeClient;' 'import android.webkit.WebResourceRequest;' 'import android.webkit.WebSettings;' 'import android.webkit.WebView;' 'import android.webkit.WebViewClient;' '' 'public class MainActivity extends Activity {' '    private WebView web;' '    private static final String URL = "https://physicstory.ir/moshaver/index.php";' '' '    @SuppressLint("SetJavaScriptEnabled")' '    @Override' '    protected void onCreate(Bundle b) {' '        super.onCreate(b);' '        web = new WebView(this);' '        WebSettings s = web.getSettings();' '        s.setJavaScriptEnabled(true);' '        s.setDomStorageEnabled(true);' '        s.setDatabaseEnabled(true);' '        s.setMediaPlaybackRequiresUserGesture(false);' '        s.setJavaScriptCanOpenWindowsAutomatically(true);' '        s.setSupportZoom(false);' '        s.setLoadWithOverviewMode(true);' '        s.setUseWideViewPort(true);' '        web.setWebChromeClient(new WebChromeClient());' '        web.setWebViewClient(new WebViewClient() {' '            @Override' '            public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {' '                Uri u = r.getUrl();' '                String host = u.getHost() == null ? "" : u.getHost();' '                if (!host.contains("physicstory.ir")) {' '                    try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) {}' '                    return true;' '                }' '                return false;' '            }' '        });' '        web.setBackgroundColor(Color.parseColor("#141519"));' '        setContentView(web);' '        web.loadUrl(URL);' '    }' '' '    @Override' '    public void onBackPressed() {' '        if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed();' '    }' '}' > app/src/main/java/ir/physicstory/moshaver/MainActivity.java
          wget -q -O icon.png "https://physicstory.ir/wp-content/uploads/2026/09/1231.png"
          for S in 108 162 216 324 432; do convert icon.png -resize ${S}x${S} -background white -gravity center -extent ${S}x${S} fg_${S}.png; done
          cp fg_108.png app/src/main/res/mipmap-mdpi/iconfg.png
          cp fg_162.png app/src/main/res/mipmap-hdpi/iconfg.png
          cp fg_216.png app/src/main/res/mipmap-xhdpi/iconfg.png
          cp fg_324.png app/src/main/res/mipmap-xxhdpi/iconfg.png
          cp fg_432.png app/src/main/res/mipmap-xxxhdpi/iconfg.png
          cp fg_108.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp fg_162.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp fg_216.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp fg_324.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp fg_432.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: key
        run: |
          keytool -genkeypair -v -keystore app/keystore.jks -alias moshaver -keyalg RSA -keysize 2048 -validity 10000 -storepass MoshaApp1405 -keypass MoshaApp1405 -dname "CN=Moshaver, O=Ahmadpour, L=Mashhad, C=IR"
      - name: build
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.4/bin/gradle assembleRelease --no-daemon -q
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: moshaver-apk
          path: app/build/outputs/apk/release/app-release.apk
